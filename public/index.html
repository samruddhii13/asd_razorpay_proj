<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Razorpay Test Checkout</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #111827;
        background-color: #f3f4f6;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }

      .card {
        width: 100%;
        max-width: 400px;
        background: #ffffff;
        border-radius: 12px;
        padding: 28px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin: 0 0 6px;
        font-size: 1.35rem;
      }

      .subtitle {
        margin: 0 0 20px;
        font-size: 0.9rem;
        color: #6b7280;
      }

      label {
        display: block;
        font-size: 0.875rem;
        font-weight: 600;
        margin-bottom: 6px;
      }

      .input-row {
        display: flex;
        align-items: center;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 16px;
      }

      .currency {
        padding: 10px 12px;
        background: #f9fafb;
        border-right: 1px solid #d1d5db;
        color: #374151;
        font-weight: 600;
      }

      input[type="number"] {
        flex: 1;
        border: none;
        padding: 10px 12px;
        font-size: 1rem;
        outline: none;
      }

      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background-color: #2563eb;
        color: #ffffff;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background-color: #1d4ed8;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .status {
        margin-top: 16px;
        padding: 12px;
        border-radius: 8px;
        font-size: 0.9rem;
        line-height: 1.4;
        display: none;
        word-break: break-word;
      }

      .status.success {
        display: block;
        background: #ecfdf5;
        color: #065f46;
        border: 1px solid #a7f3d0;
      }

      .status.error {
        display: block;
        background: #fef2f2;
        color: #991b1b;
        border: 1px solid #fecaca;
      }

      .status.info {
        display: block;
        background: #eff6ff;
        color: #1e40af;
        border: 1px solid #bfdbfe;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Razorpay Payment Demo</h1>
      <p class="subtitle">Test Mode integration (INR)</p>

      <form id="payment-form">
        <label for="amount">Amount (INR)</label>
        <div class="input-row">
          <span class="currency">₹</span>
          <input
            id="amount"
            name="amount"
            type="number"
            min="1"
            step="0.01"
            value="100"
            required
          />
        </div>

        <button id="pay-btn" type="submit">Pay Now</button>
      </form>

      <div id="status" class="status" role="status" aria-live="polite"></div>
    </main>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
      const form = document.getElementById("payment-form");
      const amountInput = document.getElementById("amount");
      const payButton = document.getElementById("pay-btn");
      const statusBox = document.getElementById("status");

      function setStatus(type, message) {
        statusBox.className = `status ${type}`;
        statusBox.textContent = message;
      }

      function setLoading(isLoading) {
        payButton.disabled = isLoading;
        payButton.textContent = isLoading ? "Processing..." : "Pay Now";
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const amount = Number(amountInput.value);
        if (!Number.isFinite(amount) || amount < 1) {
          setStatus("error", "Please enter an amount of at least ₹1.");
          return;
        }

        if (typeof window.Razorpay !== "function") {
          setStatus(
            "error",
            "Razorpay Checkout script failed to load. Check your internet connection and refresh."
          );
          return;
        }

        setLoading(true);
        setStatus("info", "Creating Razorpay order...");

        try {
          const orderResponse = await fetch("/create-order", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ amount }),
          });

          const orderData = await orderResponse.json();
          if (!orderResponse.ok) {
            throw new Error(orderData.error || "Unable to create order.");
          }

          const options = {
            key: orderData.key_id,
            amount: orderData.amount,
            currency: orderData.currency,
            order_id: orderData.order_id,
            name: "Razorpay Test Demo",
            description: "Test Mode Payment",
            handler: async (paymentResponse) => {
              setStatus("info", "Verifying payment signature...");
              try {
                const verifyResponse = await fetch("/verify-payment", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({
                    razorpay_order_id: paymentResponse.razorpay_order_id,
                    razorpay_payment_id: paymentResponse.razorpay_payment_id,
                    razorpay_signature: paymentResponse.razorpay_signature,
                  }),
                });

                const verifyData = await verifyResponse.json();
                if (verifyResponse.ok && verifyData.success) {
                  setStatus(
                    "success",
                    `Payment successful and verified! Payment ID: ${paymentResponse.razorpay_payment_id}`
                  );
                } else {
                  setStatus(
                    "error",
                    verifyData.error || "Payment signature verification failed."
                  );
                }
              } catch (verifyError) {
                setStatus(
                  "error",
                  `Verification request failed: ${verifyError.message}`
                );
              } finally {
                setLoading(false);
              }
            },
            modal: {
              ondismiss: () => {
                setLoading(false);
                setStatus("info", "Payment popup was closed before completion.");
              },
            },
          };

          const rzp = new window.Razorpay(options);
          rzp.on("payment.failed", (failureResponse) => {
            setLoading(false);
            const reason =
              failureResponse?.error?.description || "Payment failed.";
            setStatus("error", `Payment failed: ${reason}`);
          });

          rzp.open();
        } catch (err) {
          setLoading(false);
          setStatus("error", err.message || "Something went wrong.");
        }
      });
    </script>
  </body>
</html>
